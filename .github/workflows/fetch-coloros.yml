name: Fetch ColorOS 16.0.8 from GDrive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ColorOS 16.0.8
        run: |
          pip install -q -U gdown
          gdown 1ADSKTl3cQvXMyzVPeXvy55_ZLgU4xQIZ -O ColorOS16.0.8-rolex.zip
          ls -la ColorOS16.0.8-rolex.zip
      - name: Split large zip into parts
        run: |
          SIZE=$(stat -c%s ColorOS16.0.8-rolex.zip)
          echo "zip size: $SIZE"
          if [ "$SIZE" -gt 1900000000 ]; then
            split -b 1900M -d -a 2 ColorOS16.0.8-rolex.zip ColorOS16.0.8-rolex.zip.
            rm ColorOS16.0.8-rolex.zip
            ls -la
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ColorOS16.0.8-rolex.zip*
          tag_name: coloros16
          allow_unchanged_tag: true
          name: ColorOS 16.0.8 (Android 16) - Redmi 4A
          body: |
            ColorOS 16.0.8 (Android 16) port for Xiaomi Redmi 4A (rolex)
            Source: 4PDA Redmi 4A thread, post by masana13
            NOTE: If the zip was split into .part00/.part01/... files,
            download ALL parts and merge on Windows:
            copy /b ColorOS16.0.8-rolex.zip.part00+ColorOS16.0.8-rolex.zip.part01+... ColorOS16.0.8-rolex.zip
